<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chant Karo — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff8ee;
        color: #241c2e;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      button {
        margin-top: 1rem;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        border: none;
        background: #e8734a;
        color: white;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        This page hasn't been cached yet. If you've already opened Chant Karo before, try going back —
        Tap Mode and your saved practices work fully offline.
      </p>
      <button onclick="location.reload()">Try Again</button>
    </div>
  </body>
</html>
